name: T20 Android 16 prepare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android16-prepare.yml'

permissions:
  contents: read

env:
  SOURCE_URL: https://github.com/ponces/treble_aosp/releases/download/v2025.06.25/aosp-arm64-ab-vanilla-16.0-20250625.img.xz
  SOURCE_SHA256: f3abc15e85fb3d8050881c0710259f8e12baf8fd5cf05598e672073b7816c831
  SYSTEM_PARTITION_SIZE: '2684354560'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout port project
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget xz-utils e2fsprogs attr android-sdk-libsparse-utils file

      - name: Download verified Android 16 TrebleDroid base
        run: |
          set -euxo pipefail
          wget -O android16.img.xz "$SOURCE_URL"
          echo "$SOURCE_SHA256  android16.img.xz" | sha256sum -c -
          unxz android16.img.xz
          mv android16.img android16-sar.img
          file android16-sar.img
          ls -lh android16-sar.img

      - name: Convert Android 16 image for T20 legacy system partition
        run: |
          set -euxo pipefail
          mkdir -p out mnt

          # Convert Android sparse image to a normal ext4 image when needed.
          if simg2img android16-sar.img work.img 2>/dev/null; then
            :
          else
            cp --reflink=auto android16-sar.img work.img
          fi

          file work.img | tee out/SOURCE_IMAGE_TYPE.txt
          sudo e2fsck -fy work.img

          # Android build images can use EXT4 shared blocks. Give the filesystem
          # temporary room, unshare them, then shrink it again after conversion.
          min_work_bytes=$((6 * 1024 * 1024 * 1024))
          current_bytes=$(stat -c %s work.img)
          if [ "$current_bytes" -lt "$min_work_bytes" ]; then
            truncate -s "$min_work_bytes" work.img
            sudo resize2fs work.img
          fi
          sudo e2fsck -E unshare_blocks -fy work.img

          sudo mount -o loop,rw work.img mnt
          trap 'sudo umount mnt 2>/dev/null || true' EXIT

          test -d mnt/system
          test -f mnt/system/build.prop

          # T20 stock boot mounts system.img at /system.  A/B GSIs contain a
          # nested /system directory because they are system-as-root.  Convert
          # only that filesystem layout here; do not apply the obsolete
          # Android-11-specific sas-creator APEX/VNDK rewrites.
          sudo find mnt -mindepth 1 -maxdepth 1 ! -name system -exec rm -rf -- {} +
          sudo find mnt/system -mindepth 1 -maxdepth 1 -exec mv -t mnt -- {} +
          sudo rmdir mnt/system
          sync
          sudo umount mnt
          trap - EXIT

          sudo e2fsck -fy work.img
          sudo resize2fs -M work.img
          sudo e2fsck -fy work.img
          mv work.img out/system-android16-t20.img

      - name: Validate converted image offline
        run: |
          set -euxo pipefail
          img=out/system-android16-t20.img
          test -s "$img"
          file "$img" | tee out/IMAGE_TYPE.txt
          sudo e2fsck -fn "$img" | tee out/FSCK.txt || test ${PIPESTATUS[0]} -le 1
          bytes=$(stat -c %s "$img")
          echo "image_bytes=$bytes" | tee out/REPORT.txt
          echo "system_partition_bytes=$SYSTEM_PARTITION_SIZE" | tee -a out/REPORT.txt
          if [ "$bytes" -gt "$SYSTEM_PARTITION_SIZE" ]; then
            echo "ERROR: image does not fit T20 system partition" | tee -a out/REPORT.txt
            exit 20
          fi

          mkdir -p verify
          sudo mount -o loop,ro "$img" verify
          trap 'sudo umount verify 2>/dev/null || true' EXIT
          test -f verify/build.prop
          test -d verify/bin
          test -d verify/etc
          test -d verify/lib64
          test ! -d verify/system
          grep -E '^ro\.system\.build\.version\.release=16$|^ro\.build\.version\.release=16$' verify/build.prop | tee -a out/REPORT.txt
          grep -E '^ro\.system\.build\.version\.sdk=|^ro\.build\.version\.sdk=' verify/build.prop | tee -a out/REPORT.txt || true
          grep -E '^ro\.product\.cpu\.abi=|^ro\.product\.cpu\.abilist=' verify/build.prop | tee -a out/REPORT.txt || true
          echo 'layout=legacy-system-as-system' | tee -a out/REPORT.txt
          echo 'arch=arm64 (lib64 present)' | tee -a out/REPORT.txt
          sudo umount verify
          trap - EXIT
          sha256sum "$img" > out/SHA256SUMS

      - name: Compress prepared image
        run: |
          set -euxo pipefail
          xz -T0 -3 -v out/system-android16-t20.img
          sha256sum out/system-android16-t20.img.xz >> out/SHA256SUMS

      - name: Upload prepared Android 16 system image
        uses: actions/upload-artifact@v4
        with:
          name: T20-Android16-system-${{ github.run_number }}
          path: out/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
