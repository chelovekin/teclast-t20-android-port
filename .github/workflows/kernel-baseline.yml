name: T20 kernel baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-baseline.yml'
      - 'scripts/build_baseline.sh'
      - 'scripts/fix_final_link_compat.py'
      - 'scripts/fix_s5k3l9_pdaf.py'
      - 'scripts/prepare_source.py'
      - 'scripts/integrate_stock_kernel_parity.py'
      - 'scripts/reconstruct_stock_config.sh'
      - 'stock/**'

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout port project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 perl ca-certificates zip device-tree-compiler \
            binutils file

      - name: Select factory compiler and parity integration
        shell: bash
        run: |
          # Factory boot reports: gcc version 6.3.1 20170109
          # (Linaro GCC 6.3-2017.02). Pin that exact public Linaro release.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/build_baseline.sh')
          s = p.read_text()
          replacements = {
              'https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git':
                  'https://github.com/khadas/buildroot_toolchain_gcc_linux-x86_aarch64_gcc-linaro-6.3.1-2017.02-x86_64_aarch64-linux-gnu.git',
              '7280ce2399316a5dbd8872e0bfe69435d8719230':
                  '0bf3bc2500c1e5141bf3cd97789e2c57f51cc631',
              'CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-android-"':
                  'CROSS_COMPILE="$TOOLCHAIN/bin/aarch64-linux-gnu-"',
              'export KBUILD_BUILD_USER=t20-ci': 'export KBUILD_BUILD_USER=android',
              'export KBUILD_BUILD_HOST=github': 'export KBUILD_BUILD_HOST=tomato',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected one occurrence: {old}')
              s = s.replace(old, new, 1)

          # Keep the archived factory config untouched, but reproduce the
          # actual March-2019 binary composition: Goodix REE + LN4913, no FPC.
          # CONFIG_CUSTOM_KERNEL_HALL is a vendor-only symbol absent from the
          # public tree, so olddefconfig drops it; switch that one generated
          # Makefile line to obj-y after integrating the reconstructed driver.
          needle = '  --camera-donor "$WORK/camera-donor"\n'
          if s.count(needle) != 1:
              raise SystemExit('could not locate prepare_source completion')
          parity = (
              '\npython3 "$ROOT/scripts/integrate_stock_kernel_parity.py" --kernel "$KERNEL"\n'
              "sed -i 's#obj-$(CONFIG_CUSTOM_KERNEL_HALL) += hall/#obj-y += hall/#' "
              '"$KERNEL/drivers/misc/mediatek/sensors-1.0/Makefile"\n'
          )
          s = s.replace(needle, needle + parity, 1)
          p.write_text(s)
          PY

      - name: Build factory-config Linux 3.18.79 baseline
        shell: bash
        env:
          KBUILD_BUILD_TIMESTAMP: 'Tue Mar 12 12:31:29 CST 2019'
        run: |
          set +e
          bash scripts/build_baseline.sh
          rc=$?
          set -e

          KOUT="$RUNNER_TEMP/t20-kernel-baseline/kout"
          VMLINUX="$KOUT/vmlinux"
          ODMDTBO="$KOUT/arch/arm64/boot/dts/odmdtbo.img"

          # The legacy script may return 1 only because it searches a gzip
          # stream with strings(1). In either case, validate the uncompressed
          # linked image independently before accepting the build.
          if [[ $rc -ne 0 ]]; then
            test "$rc" -eq 1
          fi
          test -s "$VMLINUX"
          test -s "$ODMDTBO"
          test -s out/Image.gz-dtb
          test -s out/Image.gz
          test -s out/mt6797.dtb

          grep -aFq 'lq101r1sx01a_wqxga_dsi_vdo' "$VMLINUX"
          grep -aFq 'bq24296' "$VMLINUX"
          grep -aFq 'mediatek,sw_charger' "$VMLINUX"
          if grep -aFq 'ti,bq24296' "$VMLINUX"; then
            echo 'ERROR: non-stock BQ24296 OF compatible survived adaptation'
            exit 22
          fi

          # Exact March-2019 factory-binary parity gates. These source paths and
          # ABI strings are present in the stock Image and absent from run #36.
          grep -aFq 'drivers/input/fingerprint/goodix_ree/gf_common.c' "$VMLINUX"
          grep -aFq 'goodix,fingerprint' "$VMLINUX"
          grep -aFq 'mediatek,goodix-fp' "$VMLINUX"
          grep -aFq 'Finger Print: Have not used Goodix, return' "$VMLINUX"
          grep -aFq 'drivers/misc/mediatek/sensors-1.0/hall/ln4913/ln4913.c' "$VMLINUX"
          grep -aFq 'mediatek,hall-gpio-int' "$VMLINUX"
          grep -aFq 'ln4913_Driver' "$VMLINUX"
          if grep -aFq 'drivers/input/fingerprint/fpc/fpc1020_main.c' "$VMLINUX"; then
            echo 'ERROR: FPC implementation is linked but absent from exact March stock kernel'
            exit 21
          fi

          nm "$VMLINUX" > "$RUNNER_TEMP/t20-vmlinux.nm"
          grep -Eq '[[:space:]][Tt][[:space:]]+battery_disable_batfet$' "$RUNNER_TEMP/t20-vmlinux.nm"
          grep -Eq '[[:space:]][Tt][[:space:]]+gf_probe$' "$RUNNER_TEMP/t20-vmlinux.nm"
          grep -Eq '[[:space:]][Tt][[:space:]]+ln4913_probe$' "$RUNNER_TEMP/t20-vmlinux.nm"
          grep -E '([[:space:]]gf_|[[:space:]]ln4913_)' "$RUNNER_TEMP/t20-vmlinux.nm" > out/hardware-symbols.txt
          rm -f "$RUNNER_TEMP/t20-vmlinux.nm"

          cp "$ODMDTBO" out/odmdtbo.img
          sha256sum out/Image.gz-dtb out/Image.gz out/mt6797.dtb out/odmdtbo.img > out/SHA256SUMS
          sed -i 's/^result=.*/result=PASS/; s/^exit_code=.*/exit_code=0/' out/BUILD_STATUS.txt
          echo 'BASELINE BUILD PASS (factory compiler + stock hardware parity gates)'

      - name: Upload build diagnostics and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T20-kernel-baseline-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
