name: T20 kernel baseline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-baseline.yml'
      - 'scripts/**'
      - 'stock/**'

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Checkout port project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git bc bison flex libssl-dev libelf-dev \
            libncurses-dev python3 perl ca-certificates zip device-tree-compiler \
            binutils file

      - name: Build factory-config Linux 3.18.79 baseline
        run: bash scripts/build_baseline.sh

      - name: Upload build diagnostics and images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T20-kernel-baseline-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 14
